<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Jenn's Command Center — CINC Marketing</title>
<script>
  (function() {
    var saved = null;
    try { saved = localStorage.getItem("jcc-theme"); } catch (e) {}
    var theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<link rel="icon" type="image/svg+xml" href="Images/Logo/CINC%20Logo%20For%20Light%20Backgrounds.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0B1F33;
    --text-1: #14293e;
    --text-2: #5c6e80;
    --text-3: #97a5b3;
    --accent: #22A6F2;
    --accent-text: #0d7ac2;
    --teal: #1FD6A1;
    --teal-text: #0d8a67;
    --amber: #e8a13d;
    --amber-text: #92600e;
    --violet: #8b7ff0;
    --violet-text: #5a4dcf;
    --red: #e05252;
    --red-text: #b03030;
    --bg: #f7f9fb;
    --card: #ffffff;
    --line: rgba(11, 31, 51, 0.08);
    --line-strong: rgba(11, 31, 51, 0.14);
    --shadow-card: 0 1px 2px rgba(11,31,51,.04), 0 4px 16px rgba(11,31,51,.03);
    --shadow-lift: 0 2px 4px rgba(11,31,51,.06), 0 12px 28px rgba(11,31,51,.08);
    --radius: 16px;
    --ease: cubic-bezier(.25,.7,.3,1);
    --topbar-bg: rgba(255,255,255,.82);
    --control-bg: rgba(11,31,51,.05);
    --seg-active-bg: #ffffff;
    --seg-active-shadow: 0 1px 3px rgba(11,31,51,.10);
    --chip-bg: #ffffff;
    --row-hover: rgba(11,31,51,.015);
    --tick-bg: rgba(11,31,51,.08);
    --selection: rgba(34,166,242,.18);
  }
  [data-theme="dark"] {
    --ink: #F2F6FA;
    --text-1: #E4EBF2;
    --text-2: #94A6B8;
    --text-3: #5E7286;
    --accent-text: #4FB8F5;
    --teal-text: #33DCAE;
    --amber-text: #E3AA4A;
    --violet-text: #ABA1F7;
    --red-text: #EE7A7A;
    --bg: #0C141E;
    --card: #121D2A;
    --line: rgba(255,255,255,.07);
    --line-strong: rgba(255,255,255,.14);
    --shadow-card: 0 1px 2px rgba(0,0,0,.35), 0 4px 16px rgba(0,0,0,.25);
    --shadow-lift: 0 2px 4px rgba(0,0,0,.45), 0 14px 32px rgba(0,0,0,.4);
    --topbar-bg: rgba(12,20,30,.78);
    --control-bg: rgba(255,255,255,.06);
    --seg-active-bg: #1D2B3B;
    --seg-active-shadow: 0 1px 3px rgba(0,0,0,.5);
    --chip-bg: #182534;
    --row-hover: rgba(255,255,255,.02);
    --tick-bg: rgba(255,255,255,.09);
    --selection: rgba(34,166,242,.3);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text-1);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    -webkit-tap-highlight-color: transparent;
  }
  a { color: var(--accent-text); text-decoration: none; }
  a:hover { text-decoration: underline; }
  ::selection { background: var(--selection); }
  body, .topbar, .group, .gtm-card, .metrics, .empty, .datechip, #search,
  details.archive > summary, .filters select, .info-pop .pop { transition: background-color .25s var(--ease), border-color .25s var(--ease), color .25s var(--ease); }

  /* ---------- Header ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: var(--topbar-bg);
    -webkit-backdrop-filter: blur(16px) saturate(1.6);
    backdrop-filter: blur(16px) saturate(1.6);
    border-bottom: 1px solid var(--line);
  }
  .topbar-inner {
    max-width: 1120px; margin: 0 auto; padding: 0 28px;
    display: flex; align-items: center; gap: 20px;
    height: 64px;
  }
  .logo { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .logo img { height: 26px; display: block; }
  .logo .divider { width: 1px; height: 22px; background: var(--line-strong); }
  .logo .site-name {
    font-size: 13.5px; font-weight: 500; color: var(--text-2);
    letter-spacing: -0.01em; white-space: nowrap;
  }

  .seg {
    display: flex; gap: 2px; background: var(--control-bg);
    padding: 3px; border-radius: 99px; margin-left: auto;
    overflow-x: auto; scrollbar-width: none;
  }
  .seg::-webkit-scrollbar { display: none; }
  .seg a {
    font-size: 13px; font-weight: 500; color: var(--text-2);
    padding: 6px 14px; border-radius: 99px; white-space: nowrap;
    transition: color .18s var(--ease), background .18s var(--ease), box-shadow .18s var(--ease);
  }
  .seg a:hover { color: var(--text-1); text-decoration: none; }
  .seg a.active {
    background: var(--seg-active-bg); color: var(--ink);
    box-shadow: var(--seg-active-shadow);
  }
  .seg a .n {
    font-size: 11px; color: var(--text-3); margin-left: 5px;
    font-variant-numeric: tabular-nums;
  }
  .seg a.active .n { color: var(--accent-text); }

  img.logo-dark { display: none; }
  [data-theme="dark"] img.logo-light { display: none; }
  [data-theme="dark"] img.logo-dark { display: block; }

  #theme-toggle {
    flex-shrink: 0; width: 32px; height: 32px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--control-bg); color: var(--text-2);
    border: none; border-radius: 50%; cursor: pointer;
    transition: background .2s var(--ease), color .2s var(--ease);
  }
  #theme-toggle:hover { color: var(--ink); }
  #theme-toggle svg { width: 16px; height: 16px; }
  #theme-toggle .ic-moon { display: none; }
  [data-theme="dark"] #theme-toggle .ic-sun { display: none; }
  [data-theme="dark"] #theme-toggle .ic-moon { display: block; }

  .search-wrap { position: relative; flex-shrink: 0; }
  .search-wrap svg {
    position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    width: 14px; height: 14px; color: var(--text-3); pointer-events: none;
  }
  #search {
    font: inherit; font-size: 13px; color: var(--text-1);
    background: var(--control-bg); border: 1px solid transparent;
    border-radius: 99px; padding: 7px 14px 7px 32px; width: 170px;
    outline: none; transition: all .2s var(--ease);
  }
  #search::placeholder { color: var(--text-3); }
  #search:focus {
    background: var(--card); border-color: rgba(34,166,242,.5); width: 220px;
    box-shadow: 0 0 0 3px rgba(34,166,242,.12);
  }

  /* ---------- Layout ---------- */
  main { max-width: 1120px; margin: 0 auto; padding: 36px 28px 80px; }
  .view { display: none; }
  .view.active { display: block; animation: rise .28s var(--ease); }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .eyebrow {
    font-size: 11px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase;
    color: var(--text-3); margin: 40px 0 14px;
    display: flex; align-items: baseline; gap: 10px;
  }
  .eyebrow:first-child { margin-top: 0; }
  .eyebrow .link {
    font-size: 12px; font-weight: 500; letter-spacing: 0; text-transform: none;
    margin-left: auto;
  }

  /* ---------- Metrics ---------- */
  .metrics {
    display: grid; grid-template-columns: repeat(4, 1fr);
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow-card); overflow: hidden;
  }
  .metric { padding: 22px 26px; border-left: 1px solid var(--line); }
  .metric:first-child { border-left: none; }
  .metric .label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
  .metric .value {
    font-size: 38px; font-weight: 600; letter-spacing: -0.03em; color: var(--ink);
    font-variant-numeric: tabular-nums; line-height: 1.15; margin-top: 6px;
  }
  @media (max-width: 800px) {
    .metrics { grid-template-columns: 1fr 1fr; }
    .metric { border-top: 1px solid var(--line); }
    .metric:nth-child(-n+2) { border-top: none; }
    .metric:nth-child(odd) { border-left: none; }
    .metric:nth-child(even) { border-left: 1px solid var(--line); }
    .metric .value { font-size: 30px; }
  }

  /* ---------- Row groups (lists) ---------- */
  .group {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow-card); overflow: hidden;
  }
  .row {
    display: flex; align-items: flex-start; gap: 16px;
    padding: 15px 20px; border-top: 1px solid var(--line);
    transition: background .15s var(--ease);
  }
  .row:first-child { border-top: none; }
  .row:hover { background: var(--row-hover); }

  .datechip {
    flex-shrink: 0; width: 46px; text-align: center;
    border: 1px solid var(--line); border-radius: 10px;
    padding: 5px 0 6px; background: var(--chip-bg);
  }
  .datechip .m { font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-text); line-height: 1.2; }
  .datechip .d { font-size: 17px; font-weight: 600; color: var(--ink); line-height: 1.2; font-variant-numeric: tabular-nums; }
  .datechip.tbd .m { color: var(--text-3); }
  .datechip.tbd .d { color: var(--text-3); font-size: 13px; padding: 2px 0; }

  .row-main { min-width: 0; flex: 1; }
  .row-title { font-size: 14.5px; font-weight: 500; color: var(--ink); letter-spacing: -0.005em; }
  .row-title .flag {
    font-size: 11px; font-weight: 500; color: var(--text-3);
    border: 1px dashed var(--line-strong); border-radius: 6px;
    padding: 1px 6px; margin-left: 8px; vertical-align: 1px;
  }
  .row-meta { font-size: 12.5px; color: var(--text-2); margin-top: 2px; }
  .row-meta .kind { text-transform: uppercase; letter-spacing: .06em; font-size: 10.5px; font-weight: 600; color: var(--text-3); }
  .row-meta .soon { color: var(--amber-text); font-weight: 500; }
  .row-notes { font-size: 13px; color: var(--text-2); margin-top: 6px; max-width: 62ch; }
  .row-links { margin-top: 7px; display: flex; gap: 6px; flex-wrap: wrap; }
  .row-links a {
    font-size: 12px; font-weight: 500; color: var(--accent-text);
    border: 1px solid var(--line); border-radius: 99px; padding: 3px 11px;
    transition: all .15s var(--ease); background: var(--chip-bg);
  }
  .row-links a:hover { border-color: rgba(34,166,242,.45); text-decoration: none; background: rgba(34,166,242,.08); }

  .row-side { flex-shrink: 0; text-align: right; padding-top: 2px; }

  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--text-2); white-space: nowrap; }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); flex-shrink: 0; }
  .status.s-idea .dot { background: #b8c2cc; }
  .status.s-planning .dot, .status.s-drafting .dot { background: var(--amber); }
  .status.s-planning, .status.s-drafting { color: var(--amber-text); }
  .status.s-in-review .dot { background: var(--violet); }
  .status.s-in-review { color: var(--violet-text); }
  .status.s-confirmed .dot, .status.s-scheduled .dot { background: var(--accent); }
  .status.s-confirmed, .status.s-scheduled { color: var(--accent-text); }
  .status.s-complete .dot, .status.s-published .dot { background: var(--teal); }
  .status.s-complete, .status.s-published { color: var(--teal-text); }
  .status.s-cancelled .dot { background: var(--red); }
  .status.s-cancelled { color: var(--red-text); }
  .status.s-planned .dot { background: #b8c2cc; }
  .status.s-in-progress .dot { background: var(--amber); }
  .status.s-in-progress { color: var(--amber-text); }
  .status.s-future .dot { background: var(--violet); }
  .status.s-future { color: var(--violet-text); }

  /* ---------- GTM board ---------- */
  .board { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 18px; }
  @media (max-width: 880px) { .board { grid-template-columns: 1fr; } }
  .col-head {
    font-size: 11px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase;
    color: var(--text-3); margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
  }
  .col-head .count { color: var(--text-3); font-weight: 500; font-variant-numeric: tabular-nums; }

  .gtm-card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow-card); padding: 16px 18px; margin-bottom: 12px;
    transition: box-shadow .2s var(--ease), transform .2s var(--ease), border-color .2s var(--ease);
  }
  .gtm-card.linked { cursor: pointer; }
  .gtm-card.linked:hover { box-shadow: var(--shadow-lift); transform: translateY(-1px); border-color: var(--line-strong); }
  .row.linked { cursor: pointer; }
  .gtm-head { display: flex; align-items: center; gap: 10px; }
  .gtm-title { font-size: 14.5px; font-weight: 600; color: var(--ink); letter-spacing: -0.005em; flex: 1; min-width: 0; }
  .gtm-card .arrow, .row.linked .arrow {
    flex-shrink: 0; width: 15px; height: 15px; color: var(--text-3);
    transition: transform .2s var(--ease), color .2s var(--ease);
  }
  .row.linked .arrow { align-self: center; }
  .gtm-card.linked:hover .arrow, .row.linked:hover .arrow { transform: translateX(2px); color: var(--accent-text); }
  .gtm-meta { font-size: 12.5px; color: var(--text-2); margin-top: 3px; }
  .ticks { display: flex; gap: 4px; margin-top: 12px; align-items: center; }
  .ticks .t { height: 4px; flex: 1; border-radius: 2px; background: var(--tick-bg); transition: background .2s; }
  .ticks .t.done { background: var(--teal); }
  .ticks .pct { font-size: 11px; font-weight: 600; color: var(--text-3); margin-left: 6px; font-variant-numeric: tabular-nums; }
  /* ---------- GTM project page ---------- */
  .back-link {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 500; color: var(--text-2); margin-bottom: 20px;
  }
  .back-link:hover { color: var(--accent-text); text-decoration: none; }
  .back-link svg { width: 14px; height: 14px; }
  .detail-title { font-size: 27px; font-weight: 600; letter-spacing: -0.02em; color: var(--ink); margin: 0; line-height: 1.25; }
  .detail-meta { font-size: 13.5px; color: var(--text-2); margin-top: 8px; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  .detail-desc { font-size: 14.5px; color: var(--text-2); max-width: 68ch; margin-top: 12px; }
  .detail-head .row-links { margin-top: 14px; }

  .timeline { padding: 6px 0 0 2px; }
  .tl-item { position: relative; padding: 0 0 24px 32px; }
  .tl-item::before {
    content: ""; position: absolute; left: 6px; top: 18px; bottom: 0;
    width: 1.5px; background: var(--line);
  }
  .tl-item:last-child::before { display: none; }
  .tl-dot {
    position: absolute; left: 0; top: 3px; width: 14px; height: 14px;
    border-radius: 50%; background: var(--bg); border: 2.5px solid var(--text-3);
  }
  .tl-dot.milestone { border-color: var(--accent); background: var(--accent); }
  .tl-dot.complete { border-color: var(--teal); background: var(--teal); }
  .tl-dot.in-progress { border-color: var(--amber); }
  .tl-date { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
  .tl-title { font-size: 14.5px; font-weight: 500; color: var(--text-1); margin-top: 1px; }
  .tl-title .flag { font-size: 11px; font-weight: 500; color: var(--text-3); border: 1px dashed var(--line-strong); border-radius: 6px; padding: 1px 6px; margin-left: 8px; vertical-align: 1px; }
  .tl-track { font-size: 12px; color: var(--text-3); margin-top: 1px; }
  .tl-today {
    position: relative; margin: 0 0 24px; padding-left: 32px;
    font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
    color: var(--accent-text); line-height: 14px;
  }
  .tl-today::before {
    content: ""; position: absolute; left: 0; top: 6px;
    width: 14px; height: 2px; background: var(--accent); border-radius: 1px;
  }
  .checklist-card { padding: 8px 20px 12px; }
  .checklist li.clickable { cursor: pointer; border-radius: 8px; margin: 0 -8px; padding: 5px 8px; transition: background .15s var(--ease); }
  .checklist li.clickable:hover { background: var(--control-bg); }
  .checklist li.clickable:hover .ck { border-color: var(--teal); }
  .ck-local { width: 5px; height: 5px; border-radius: 50%; background: var(--amber); margin-left: 8px; display: inline-block; vertical-align: 2px; }
  .ck-note { font-size: 12px; color: var(--text-3); padding: 10px 8px 4px; border-top: 1px solid var(--line); margin-top: 8px; }
  .checklist { list-style: none; margin: 0; padding: 0; }
  .checklist li {
    display: flex; align-items: center; gap: 9px;
    font-size: 13px; color: var(--text-2); padding: 4px 0;
  }
  .checklist .ck {
    width: 15px; height: 15px; border-radius: 50%; flex-shrink: 0;
    border: 1.5px solid var(--line-strong); display: inline-flex;
    align-items: center; justify-content: center;
  }
  .checklist li.done { color: var(--text-1); }
  .checklist li.done .ck { background: var(--teal); border-color: var(--teal); }
  .checklist li.done .ck svg { width: 9px; height: 9px; color: #fff; }
  .gtm-notes { font-size: 13px; color: var(--text-2); margin: 10px 0 0; }

  .gtm-past-row { padding: 12px 20px; }
  .gtm-past-row .row-title { font-weight: 500; color: var(--text-1); }

  /* ---------- Archives ---------- */
  details.archive { margin-bottom: 10px; }
  details.archive > summary {
    list-style: none; cursor: pointer; user-select: none;
    display: flex; align-items: center; gap: 10px;
    font-size: 13px; font-weight: 500; color: var(--text-2);
    padding: 12px 20px; background: var(--card);
    border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow-card);
    transition: border-color .15s var(--ease);
  }
  details.archive > summary::-webkit-details-marker { display: none; }
  details.archive > summary:hover { border-color: var(--line-strong); }
  details.archive > summary .count { color: var(--text-3); font-weight: 400; }
  details.archive > summary .chev { margin-left: auto; width: 14px; height: 14px; color: var(--text-3); transition: transform .25s var(--ease); }
  details.archive[open] > summary { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  details.archive[open] > summary .chev { transform: rotate(180deg); }
  details.archive .group { border-top: none; border-top-left-radius: 0; border-top-right-radius: 0; box-shadow: none; }

  /* ---------- Empty states ---------- */
  .empty {
    text-align: center; padding: 36px 24px; color: var(--text-3);
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow-card);
  }
  .empty svg { width: 26px; height: 26px; color: var(--text-3); opacity: .7; margin-bottom: 8px; }
  .empty p { margin: 0; font-size: 13.5px; }
  .empty-col { background: transparent; border: 1px dashed var(--line-strong); box-shadow: none; padding: 26px 18px; border-radius: var(--radius); }

  /* ---------- Filters ---------- */
  .filters { display: flex; gap: 8px; margin-bottom: 22px; flex-wrap: wrap; }
  .filters select {
    font: inherit; font-size: 13px; font-weight: 500; color: var(--text-1);
    padding: 7px 30px 7px 14px; border: 1px solid var(--line); border-radius: 99px;
    background: var(--chip-bg) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6" viewBox="0 0 10 6"><path d="M1 1l4 4 4-4" stroke="%2397a5b3" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>') no-repeat right 12px center;
    appearance: none; -webkit-appearance: none; cursor: pointer;
    transition: border-color .15s var(--ease);
  }
  .filters select:hover { border-color: var(--line-strong); }
  .filters select:focus { outline: none; border-color: rgba(34,166,242,.5); box-shadow: 0 0 0 3px rgba(34,166,242,.12); }

  /* ---------- Two column ---------- */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; align-items: start; }
  @media (max-width: 880px) { .two-col { grid-template-columns: 1fr; } }

  /* ---------- Search results ---------- */
  .search-note { font-size: 13.5px; color: var(--text-2); margin-bottom: 22px; }
  .search-note b { color: var(--ink); font-weight: 600; }

  /* ---------- Footer ---------- */
  footer {
    max-width: 1120px; margin: 0 auto; padding: 0 28px 48px;
    display: flex; align-items: center; gap: 14px;
    font-size: 12px; color: var(--text-3);
  }
  footer img { height: 16px; opacity: .55; }
  .info-pop { position: relative; margin-left: auto; }
  .info-pop > summary {
    list-style: none; cursor: pointer; width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;

<script>
const DATA = window.COMMAND_CENTER_DATA;
const TODAY = new Date(); TODAY.setHours(0,0,0,0);

const CONTENT_TYPE_LABELS = {
  "blog": "Blog post", "white-paper": "White paper", "testimonial": "Testimonial",
  "buy-side-brief": "Buy-side brief", "press-release": "Press release"
};
const EVENT_TYPE_LABELS = { "tradeshow": "Tradeshow", "webinar": "Webinar" };
const CONTENT_CATEGORY_LABELS = { "product": "Product", "client-success": "Client success story", "industry": "Industry topic" };
const STATUS_LABELS = {
  "idea": "Idea", "planning": "Planning", "confirmed": "Confirmed",
  "complete": "Complete", "cancelled": "Cancelled", "drafting": "Drafting",
  "in-review": "In review", "scheduled": "Scheduled", "published": "Published",
  "planned": "Planned", "in-progress": "In progress", "future": "Future"
};
const TRACKS = [
  { key: "internal", label: "Client Services", sub: "Internal" },
  { key: "sales", label: "Sales", sub: "Internal" },
  { key: "external", label: "Existing clients & prospects", sub: "External" }
];
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

const CHECK_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4 10-10"/></svg>`;
const CHEV_SVG = `<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>`;
const ARROW_SVG = `<svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>`;
const BACK_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>`;
const ICONS = {
  calendar: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>`,
  doc: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>`,
  rocket: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>`,
  search: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>`
};

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
function parseDate(s) {
  if (!s) return null;
  const [y,m,d] = s.split("-").map(Number);
  if (!y || !m || !d) return null;
  return new Date(y, m-1, d);
}
function fmtDate(s) {
  const d = parseDate(s);
  if (!d) return "";
  return `${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
}
function fmtRange(a, b) {
  const da = parseDate(a), db = parseDate(b);
  if (!da) return "";
  if (!db || a === b) return fmtDate(a);
  if (da.getFullYear() === db.getFullYear()) {
    if (da.getMonth() === db.getMonth())
      return `${MONTHS[da.getMonth()]} ${da.getDate()}–${db.getDate()}, ${db.getFullYear()}`;
    return `${MONTHS[da.getMonth()]} ${da.getDate()} – ${MONTHS[db.getMonth()]} ${db.getDate()}, ${db.getFullYear()}`;
  }
  return `${fmtDate(a)} – ${fmtDate(b)}`;
}
function daysUntil(s) {
  const d = parseDate(s);
  if (!d) return null;
  return Math.round((d - TODAY) / 86400000);
}
function soonText(s) {
  const n = daysUntil(s);
  if (n === null || n < 0 || n > 14) return "";
  const t = n === 0 ? "today" : n === 1 ? "tomorrow" : `in ${n} days`;
  return ` · <span class="soon">${t}</span>`;
}
function statusHtml(status, extraClass) {
  return `<span class="status s-${esc(status)} ${extraClass||""}"><span class="dot"></span>${esc(STATUS_LABELS[status] || status)}</span>`;
}
function dateChip(s) {
  const d = parseDate(s);
  if (!d) return `<div class="datechip tbd"><div class="m">Date</div><div class="d">TBD</div></div>`;
  return `<div class="datechip"><div class="m">${MONTHS[d.getMonth()]}</div><div class="d">${d.getDate()}</div></div>`;
}
function linksHtml(links) {
  if (!links || !links.length) return "";
  return `<div class="row-links">` + links.map(l =>
    `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("") + `</div>`;
}
function flagHtml(item) { return item.sample ? `<span class="flag">Sample</span>` : ""; }
function emptyHtml(icon, text, colStyle) {
  return `<div class="empty ${colStyle ? "empty-col" : ""}">${ICONS[icon] || ""}<p>${text}</p></div>`;
}
function groupWrap(rows) { return `<div class="group">${rows}</div>`; }

/* ---------- Rows ---------- */
function eventRow(e, opts) {
  opts = opts || {};
  const hasTodos = e.todos && e.todos.length;
  return `<div class="row ${hasTodos ? "linked" : ""}" ${hasTodos ? `data-event-id="${esc(e.id)}"` : ""}>
    ${dateChip(e.startDate)}
    <div class="row-main">
      <div class="row-title">${esc(e.title)}${flagHtml(e)}</div>
      <div class="row-meta">
        <span class="kind">${esc(EVENT_TYPE_LABELS[e.type] || e.type)}</span>
        ${e.startDate ? " · " + fmtRange(e.startDate, e.endDate) : ""}${soonText(e.startDate)}
        ${e.location ? " · " + esc(e.location) : ""}${e.owner ? " · " + esc(e.owner) : ""}
      </div>
      ${!opts.compact && e.notes ? `<div class="row-notes">${esc(e.notes)}</div>` : ""}
      ${!opts.compact ? linksHtml(e.links) : ""}
      ${statusHtml(e.status, "row-status-inline")}
    </div>
    <div class="row-side">${statusHtml(e.status)}</div>
    ${hasTodos ? ARROW_SVG : ""}
  </div>`;
}
function bindEventRows(scope) {
  scope.querySelectorAll("[data-event-id]").forEach(row => {
    row.addEventListener("click", ev => {
      if (ev.target.closest("a")) return;
      location.hash = "#events/" + row.dataset.eventId;
    });
  });
}

function contentRow(c, opts) {
  opts = opts || {};
  const dateStr = c.status === "published" ? c.publishDate : c.dueDate;
  const dateLabel = c.status === "published"
    ? (c.publishDate ? "Published " + fmtDate(c.publishDate) : "")
    : (c.dueDate ? "Due " + fmtDate(c.dueDate) + soonText(c.dueDate) : "");
  return `<div class="row">
    ${dateChip(dateStr)}
    <div class="row-main">
      <div class="row-title">${esc(c.title)}${flagHtml(c)}</div>
      <div class="row-meta">
        <span class="kind">${esc(CONTENT_TYPE_LABELS[c.type] || c.type)}</span>
        ${c.category ? " · " + esc(CONTENT_CATEGORY_LABELS[c.category] || c.category) : ""}
        ${dateLabel ? " · " + dateLabel : ""}${c.owner ? " · " + esc(c.owner) : ""}
      </div>
      ${!opts.compact && c.notes ? `<div class="row-notes">${esc(c.notes)}</div>` : ""}
      ${!opts.compact ? linksHtml(c.links) : ""}
      ${statusHtml(c.status, "row-status-inline")}
    </div>
    <div class="row-side">${statusHtml(c.status)}</div>
  </div>`;
}

/* ---------- Checklist local overrides ---------- */
const CK_KEY = "jcc-checklist";
function loadCk() { try { return JSON.parse(localStorage.getItem(CK_KEY)) || {}; } catch (e) { return {}; } }
function saveCk(m) { try { localStorage.setItem(CK_KEY, JSON.stringify(m)); } catch (e) {} }
let CK = loadCk();
(function cleanStale() {
  let changed = false;
  DATA.gtm.forEach(p => (p.checklist || []).forEach((it, i) => {
    const k = p.id + "|" + i;
    if (k in CK && CK[k] === !!it.done) { delete CK[k]; changed = true; }
  }));
  if (changed) saveCk(CK);
})();
function checklistOf(p) {
  return (p.checklist || []).map((it, i) => {
    const k = p.id + "|" + i;
    const local = k in CK;
    return { item: it.item, done: local ? CK[k] : !!it.done, local };
  });
}
function toggleCk(p, idx) {
  const k = p.id + "|" + idx;
  const base = !!(p.checklist[idx] && p.checklist[idx].done);
  const cur = (k in CK) ? CK[k] : base;
  if (!cur === base) delete CK[k]; else CK[k] = !cur;
  saveCk(CK);
}

/* ---------- GTM cards ---------- */
function planStats(p) {
  const plan = p.plan || {};
  const all = TRACKS.flatMap(t => plan[t.key] || []);
  return { total: all.length, done: all.filter(d => d.status === "complete").length };
}
function gtmCard(p) {
  const cl = checklistOf(p);
  const done = cl.filter(i => i.done).length;
  const ps = planStats(p);
  return `<div class="gtm-card linked" data-id="${esc(p.id)}">
    <div class="gtm-head">
      <div class="gtm-title">${esc(p.title)}</div>
      ${ARROW_SVG}
    </div>
    ${p.launchDate ? `<div class="gtm-meta">Launch ${fmtDate(p.launchDate)}${soonText(p.launchDate)}</div>` : ""}
    ${ps.total ? `<div class="gtm-meta">${ps.done}/${ps.total} deliverables complete</div>` : ""}
    ${cl.length ? `<div class="ticks">${cl.map(i => `<span class="t ${i.done ? "done" : ""}"></span>`).join("")}<span class="pct">${done}/${cl.length}</span></div>` : ""}
  </div>`;
}
function bindGtmCards(scope) {
  scope.querySelectorAll("[data-id].linked").forEach(card => {
    card.addEventListener("click", ev => {
      if (ev.target.closest("a")) return;
      location.hash = "#gtm/" + card.dataset.id;
    });
  });
}
function gtmPastRow(p) {
  return `<div class="row gtm-past-row linked" data-id="${esc(p.id)}">
    <div class="row-main">
      <div class="row-title">${esc(p.title)}</div>
      ${p.launchDate || p.notes ? `<div class="row-meta">${p.launchDate ? "Launched " + fmtDate(p.launchDate) : ""}${p.launchDate && p.notes ? " · " : ""}${esc(p.notes || "")}</div>` : ""}
      ${linksHtml(p.links)}
    </div>
    <div class="row-side">${statusHtml("complete")}</div>
    ${ARROW_SVG}
  </div>`;
}

/* ---------- GTM project page ---------- */
const STAGE_STATUS = { current: ["confirmed", "In flight"], future: ["future", "Future"], past: ["complete", "Shipped"] };

function deliverableRow(d) {
  const chip = (!d.due && d.status === "complete")
    ? `<div class="datechip tbd"><div class="m">Done</div><div class="d">—</div></div>`
    : dateChip(d.due);
  return `<div class="row">
    ${chip}
    <div class="row-main">
      <div class="row-title">${esc(d.title)}${flagHtml(d)}</div>
      <div class="row-meta">${[
        d.due ? (d.status === "complete" ? fmtDate(d.due) : "Due " + fmtDate(d.due) + soonText(d.due)) : "",
        d.owner ? esc(d.owner) : ""

      ${d.notes ? `<div class="row-notes">${esc(d.notes)}</div>` : ""}
      ${linksHtml(d.links)}
      ${statusHtml(d.status || "planned", "row-status-inline")}
    </div>
    <div class="row-side">${statusHtml(d.status || "planned")}</div>
  </div>`;
}

function renderGtmDetail(id) {
  const el = document.getElementById("view-gtm-detail");
  const p = DATA.gtm.find(x => x.id === id);
  if (!p) {
    el.innerHTML = `<a class="back-link" href="#gtm">${BACK_SVG}GTM board</a>` +
      emptyHtml("rocket", "That project isn't in the tracker.");
    return;
  }
  const plan = p.plan || {};
  const st = STAGE_STATUS[p.stage] || STAGE_STATUS.future;

  const entries = [];
  (plan.milestones || []).forEach(m => {
    if (m.date) entries.push({ date: m.date, title: m.label, track: "Milestone", dot: "milestone", sample: m.sample });
  });
  TRACKS.forEach(t => (plan[t.key] || []).forEach(d => {
    if (d.due) entries.push({ date: d.due, title: d.title, track: `${t.sub} · ${t.label}`, dot: d.status || "planned", sample: d.sample });
  }));
  entries.sort((a, b) => a.date < b.date ? -1 : 1);

  let timelineHtml = "";
  if (entries.length) {
    let todayPlaced = false;
    timelineHtml = `<div class="timeline">` + entries.map(en => {
      let marker = "";
      if (!todayPlaced && daysUntil(en.date) >= 0) { marker = `<div class="tl-today">Today</div>`; todayPlaced = true; }
      return marker + `<div class="tl-item">
        <span class="tl-dot ${en.dot}"></span>
        <div class="tl-date">${fmtDate(en.date)}</div>
        <div class="tl-title">${esc(en.title)}${en.sample ? `<span class="flag">Sample</span>` : ""}</div>
        <div class="tl-track">${esc(en.track)}</div>
      </div>`;
    }).join("") + (todayPlaced ? "" : `<div class="tl-today">Today</div>`) + `</div>`;
  } else {
    timelineHtml = emptyHtml("calendar", "No dated milestones or deliverables yet — ask Claude Code to add them.");
  }

  el.innerHTML = `
    <a class="back-link" href="#gtm">${BACK_SVG}GTM board</a>
    <div class="detail-head">
      <h1 class="detail-title">${esc(p.title)}</h1>
      <div class="detail-meta">
        ${statusHtml(st[0]).replace(esc(STATUS_LABELS[st[0]]), st[1])}
        ${p.launchDate ? `<span>Launch ${fmtDate(p.launchDate)}${soonText(p.launchDate)}</span>` : ""}
      </div>
      ${p.description ? `<div class="detail-desc">${esc(p.description)}</div>` : ""}
      ${linksHtml(p.links)}
    </div>

    <div class="eyebrow" style="margin-top:36px">Timeline</div>
    ${timelineHtml}

    ${TRACKS.map(t => {
      const items = (plan[t.key] || []).slice().sort((a,b) => (a.due||"9999") < (b.due||"9999") ? -1 : 1);
      return `<div class="eyebrow">${esc(t.sub)} — ${esc(t.label)}</div>` +
        (items.length ? groupWrap(items.map(deliverableRow).join(""))
          : emptyHtml("doc", `No ${t.label} deliverables yet.`));
    }).join("")}

    ${p.checklist && p.checklist.length ? (() => {
      const cks = checklistOf(p);
      const anyLocal = cks.some(i => i.local);
      return `
      <div class="eyebrow">Launch checklist</div>
      <div class="group checklist-card">
        <ul class="checklist">${cks.map((i, idx) =>
          `<li class="${i.done ? "done" : ""} clickable" data-ck-idx="${idx}" role="checkbox" aria-checked="${i.done}" tabindex="0"><span class="ck">${i.done ? CHECK_SVG : ""}</span>${esc(i.item)}${i.local ? `<span class="ck-local" title="Changed on this device"></span>` : ""}</li>`).join("")}</ul>
        ${anyLocal ? `<div class="ck-note">Checked items are saved on this device only — ask Claude Code to make them permanent for the whole team.</div>` : ""}
      </div>`;
    })() : ""}

    ${p.notes ? `<div class="eyebrow">Notes</div><div class="group" style="padding:14px 20px"><div class="row-notes" style="margin:0">${esc(p.notes)}</div></div>` : ""}
  `;
  el.querySelectorAll("[data-ck-idx]").forEach(li => {
    const toggle = () => { toggleCk(p, Number(li.dataset.ckIdx)); renderGtmDetail(id); };
    li.addEventListener("click", toggle);
    li.addEventListener("keydown", e => {
      if (e.key === " " || e.key === "Enter") { e.preventDefault(); toggle(); }
    });
  });
}

/* ---------- Event detail page ---------- */
function renderEventDetail(id) {
  const el = document.getElementById("view-event-detail");
  const e = DATA.events.find(x => x.id === id);
  if (!e) {
    el.innerHTML = `<a class="back-link" href="#events">${BACK_SVG}Events</a>` +
      emptyHtml("calendar", "That event isn't in the tracker.");
    return;
  }
  const todos = (e.todos || []).slice().sort((a,b) => (a.due||"9999") < (b.due||"9999") ? -1 : 1);

  let timelineHtml = "";
  const dated = todos.filter(t => t.due);
  if (dated.length) {
    let todayPlaced = false;
    timelineHtml = `<div class="timeline">` + dated.map(t => {
      let marker = "";
      if (!todayPlaced && daysUntil(t.due) >= 0) { marker = `<div class="tl-today">Today</div>`; todayPlaced = true; }
      return marker + `<div class="tl-item">
        <span class="tl-dot ${t.status || "planned"}"></span>
        <div class="tl-date">${fmtDate(t.due)}</div>
        <div class="tl-title">${esc(t.title)}${flagHtml(t)}</div>
      </div>`;
    }).join("") + (todayPlaced ? "" : `<div class="tl-today">Today</div>`) + `</div>`;
  } else {
    timelineHtml = emptyHtml("calendar", "No dated to-dos yet — ask Claude Code to add them.");
  }

  el.innerHTML = `
    <a class="back-link" href="#events">${BACK_SVG}Events</a>
    <div class="detail-head">
      <h1 class="detail-title">${esc(e.title)}</h1>
      <div class="detail-meta">
        ${statusHtml(e.status)}
        ${e.startDate ? `<span>${fmtRange(e.startDate, e.endDate)}${soonText(e.startDate)}</span>` : ""}
        ${e.location ? `<span>${esc(e.location)}</span>` : ""}
      </div>
      ${e.notes ? `<div class="detail-desc">${esc(e.notes)}</div>` : ""}
      ${linksHtml(e.links)}
    </div>

    <div class="eyebrow" style="margin-top:36px">Timeline</div>
    ${timelineHtml}

    <div class="eyebrow">To-dos</div>
    ${todos.length ? groupWrap(todos.map(deliverableRow).join("")) : emptyHtml("doc", "No to-dos tracked yet.")}
  `;
}

/* ---------- Archive grouping ---------- */
function archiveSection(label, count, innerRows) {
  return `<details class="archive">
    <summary>${esc(label)} <span class="count">· ${count} item${count === 1 ? "" : "s"}</span>${CHEV_SVG}</summary>
    <div class="group">${innerRows}</div>
  </details>`;
}
function quarterOf(s) {
  const d = parseDate(s);
  if (!d) return "Undated";
  return `Q${Math.floor(d.getMonth() / 3) + 1} ${d.getFullYear()}`;
}
function yearOf(s) {
  const d = parseDate(s);
  return d ? String(d.getFullYear()) : "Undated";
}
function groupBy(items, keyFn) {
  const map = new Map();
  items.forEach(it => {
    const k = keyFn(it);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(it);
  });
  return map;
}

/* ---------- Events view ---------- */
function renderEvents() {
  const el = document.getElementById("view-events");
  const typeF = el.dataset.typeFilter || "all";
  const statusF = el.dataset.statusFilter || "all";
  let items = DATA.events.slice().sort((a,b) => (a.startDate||"9999") < (b.startDate||"9999") ? -1 : 1);
  if (typeF !== "all") items = items.filter(e => e.type === typeF);
  if (statusF !== "all") items = items.filter(e => e.status === statusF);

  const upcoming = items.filter(e => { const n = daysUntil(e.startDate); return n === null || n >= 0; });
  const past = items.filter(e => { const n = daysUntil(e.startDate); return n !== null && n < 0; }).reverse();
  const pastByYear = groupBy(past, e => yearOf(e.startDate));

  el.innerHTML = `
    <div class="filters">
      <select id="evt-type">
        <option value="all">All types</option>
        <option value="tradeshow">Tradeshows</option>
        <option value="webinar">Webinars</option>
      </select>
      <select id="evt-status">
        <option value="all">All statuses</option>
        ${["idea","planning","confirmed","complete","cancelled"].map(s =>
          `<option value="${s}">${STATUS_LABELS[s]}</option>`).join("")}
      </select>
    </div>
    <div class="eyebrow">Upcoming</div>
    ${upcoming.length ? groupWrap(upcoming.map(e => eventRow(e)).join(""))
      : emptyHtml("calendar", "No upcoming events on the calendar.")}
    <div class="eyebrow">Past</div>
    ${past.length
      ? [...pastByYear.entries()].map(([year, evs]) =>
          archiveSection(year, evs.length, evs.map(e => eventRow(e, {compact:true})).join(""))).join("")
      : emptyHtml("calendar", "Past events will collect here.")}
  `;
  const t = el.querySelector("#evt-type"), s = el.querySelector("#evt-status");
  t.value = typeF; s.value = statusF;
  t.onchange = () => { el.dataset.typeFilter = t.value; renderEvents(); };
  s.onchange = () => { el.dataset.statusFilter = s.value; renderEvents(); };
  bindEventRows(el);
}

/* ---------- Content view ---------- */
function renderContent() {
  const el = document.getElementById("view-content");
  const typeF = el.dataset.typeFilter || "all";
  const statusF = el.dataset.statusFilter || "all";
  const catF = el.dataset.categoryFilter || "all";
  let items = DATA.content.slice().sort((a,b) => (a.dueDate||"9999") < (b.dueDate||"9999") ? -1 : 1);
  if (typeF !== "all") items = items.filter(c => c.type === typeF);
  if (statusF !== "all") items = items.filter(c => c.status === statusF);
  if (catF !== "all") items = items.filter(c => c.category === catF);

  const active = items.filter(c => c.status !== "published");
  const published = items.filter(c => c.status === "published")
    .sort((a,b) => (b.publishDate||"") < (a.publishDate||"") ? -1 : 1);
  const pubByQuarter = groupBy(published, c => quarterOf(c.publishDate));

  el.innerHTML = `
    <div class="filters">
      <select id="cnt-category">
        <option value="all">All categories</option>
        ${Object.entries(CONTENT_CATEGORY_LABELS).map(([k,v]) => `<option value="${k}">${v}</option>`).join("")}
      </select>
      <select id="cnt-type">
        <option value="all">All types</option>
        ${Object.entries(CONTENT_TYPE_LABELS).map(([k,v]) => `<option value="${k}">${v}s</option>`).join("")}
      </select>
      <select id="cnt-status">
        <option value="all">All statuses</option>
        ${["idea","drafting","in-review","scheduled","published"].map(s =>
          `<option value="${s}">${STATUS_LABELS[s]}</option>`).join("")}
      </select>
    </div>
    <div class="eyebrow">In the pipeline</div>
    ${active.length ? groupWrap(active.map(c => contentRow(c)).join(""))
      : emptyHtml("doc", "The pipeline is clear.")}
    <div class="eyebrow">Published</div>
    ${published.length
      ? [...pubByQuarter.entries()].map(([q, cs]) =>
          archiveSection(q, cs.length, cs.map(c => contentRow(c, {compact:true})).join(""))).join("")
      : emptyHtml("doc", "Published work will archive here by quarter.")}
  `;
  const cat = el.querySelector("#cnt-category"), t = el.querySelector("#cnt-type"), s = el.querySelector("#cnt-status");
  cat.value = catF; t.value = typeF; s.value = statusF;
  cat.onchange = () => { el.dataset.categoryFilter = cat.value; renderContent(); };
  t.onchange = () => { el.dataset.typeFilter = t.value; renderContent(); };
  s.onchange = () => { el.dataset.statusFilter = s.value; renderContent(); };
}

/* ---------- GTM view ---------- */
function renderGtm() {
  const el = document.getElementById("view-gtm");
  const current = DATA.gtm.filter(p => p.stage === "current");
  const future = DATA.gtm.filter(p => p.stage === "future");
  const past = DATA.gtm.filter(p => p.stage === "past");
  el.innerHTML = `
    <div class="board">
      <div>
        <div class="col-head">Current <span class="count">${current.length}</span></div>
        ${current.length ? current.map(gtmCard).join("") : emptyHtml("rocket", "No launches in flight.", true)}
      </div>
      <div>
        <div class="col-head">Future <span class="count">${future.length}</span></div>
        ${future.length ? future.map(gtmCard).join("") : emptyHtml("rocket", "Nothing queued yet.", true)}
      </div>
      <div>
        <div class="col-head">Shipped <span class="count">${past.length}</span></div>
        ${past.length ? groupWrap(past.map(gtmPastRow).join("")) : emptyHtml("rocket", "Launched projects land here.", true)}
      </div>
    </div>
  `;
  bindGtmCards(el);
}

/* ---------- Dashboard ---------- */
function renderDashboard() {
  const el = document.getElementById("view-dashboard");
  const upcomingEvents = DATA.events
    .filter(e => e.status !== "cancelled" && (daysUntil(e.startDate) === null || daysUntil(e.startDate) >= 0))
    .sort((a,b) => (a.startDate||"9999") < (b.startDate||"9999") ? -1 : 1);
  const activeContent = DATA.content.filter(c => c.status !== "published")
    .sort((a,b) => (a.dueDate||"9999") < (b.dueDate||"9999") ? -1 : 1);
  const currentGtm = DATA.gtm.filter(p => p.stage === "current");
  const futureGtm = DATA.gtm.filter(p => p.stage === "future");

  const dueSoon = [];
  DATA.events.forEach(e => {
    const n = daysUntil(e.startDate);
    if (n !== null && n >= 0 && n <= 30 && !["cancelled","complete"].includes(e.status))
      dueSoon.push({ when: e.startDate, title: e.title, kind: EVENT_TYPE_LABELS[e.type], status: e.status });
  });
  DATA.content.forEach(c => {
    const n = daysUntil(c.dueDate);
    if (n !== null && n >= 0 && n <= 30 && c.status !== "published")
      dueSoon.push({ when: c.dueDate, title: c.title, kind: CONTENT_TYPE_LABELS[c.type], status: c.status });
  });
  DATA.gtm.forEach(p => {
    const n = daysUntil(p.launchDate);
    if (n !== null && n >= 0 && n <= 30 && p.stage === "current")
      dueSoon.push({ when: p.launchDate, title: p.title + " launch", kind: "GTM", status: "confirmed" });
  });
  dueSoon.sort((a,b) => a.when < b.when ? -1 : 1);

  const agendaRow = d => `<div class="row">
    ${dateChip(d.when)}
    <div class="row-main">
      <div class="row-title">${esc(d.title)}</div>
      <div class="row-meta"><span class="kind">${esc(d.kind)}</span> · ${fmtDate(d.when)}${soonText(d.when)}</div>
    </div>
    <div class="row-side">${statusHtml(d.status)}</div>
  </div>`;

  el.innerHTML = `
    <div class="metrics">
      <div class="metric"><div class="label">GTM in flight</div><div class="value">${currentGtm.length}</div></div>
      <div class="metric"><div class="label">Upcoming events</div><div class="value">${upcomingEvents.length}</div></div>
      <div class="metric"><div class="label">Content pipeline</div><div class="value">${activeContent.length}</div></div>
      <div class="metric"><div class="label">Next 30 days</div><div class="value">${dueSoon.length}</div></div>
    </div>

    <div class="eyebrow">Next 30 days</div>
    ${dueSoon.length ? groupWrap(dueSoon.map(agendaRow).join(""))
      : emptyHtml("calendar", "Nothing dated in the next 30 days.")}

    <div class="two-col" style="margin-top: 40px;">
      <div>
        <div class="eyebrow" style="margin-top:0">Upcoming events <a class="link" href="#events">View all</a></div>
        ${upcomingEvents.length ? groupWrap(upcomingEvents.slice(0,5).map(e => eventRow(e, {compact:true})).join(""))
          : emptyHtml("calendar", "No events on the calendar.")}
      </div>
      <div>
        <div class="eyebrow" style="margin-top:0">Content pipeline <a class="link" href="#content">View all</a></div>
        ${activeContent.length ? groupWrap(activeContent.slice(0,5).map(c => contentRow(c, {compact:true})).join(""))
          : emptyHtml("doc", "The pipeline is clear.")}
      </div>
    </div>

    <div class="eyebrow">GTM in flight <a class="link" href="#gtm">View board</a></div>
    <div class="board">${currentGtm.map(gtmCard).join("")}</div>

    ${futureGtm.length ? `<div class="eyebrow">On the horizon</div><div class="board">${futureGtm.map(gtmCard).join("")}</div>` : ""}
  `;
  bindGtmCards(el);
  bindEventRows(el);
}

/* ---------- Search ---------- */
function renderSearch(q) {
  const el = document.getElementById("view-search");
  const needle = q.trim().toLowerCase();
  const match = (it, fields) => fields.some(f => (it[f] || "").toLowerCase().includes(needle));

  const evs = DATA.events.filter(e => match(e, ["title","location","notes","type","status"]));
  const cnt = DATA.content.filter(c => match(c, ["title","notes","type","status","category"]));
  const gtm = DATA.gtm.filter(p => match(p, ["title","description","notes","stage"]));
  const total = evs.length + cnt.length + gtm.length;

  el.innerHTML = `
    <div class="search-note">${total ? `<b>${total}</b> result${total === 1 ? "" : "s"} for “${esc(q)}”` : `No results for “${esc(q)}”`}</div>
    ${evs.length ? `<div class="eyebrow">Events</div>` + groupWrap(evs.map(e => eventRow(e, {compact:true})).join("")) : ""}
    ${cnt.length ? `<div class="eyebrow">Content</div>` + groupWrap(cnt.map(c => contentRow(c, {compact:true})).join("")) : ""}
    ${gtm.length ? `<div class="eyebrow">GTM projects</div><div class="board">` + gtm.map(gtmCard).join("") + `</div>` : ""}
    ${!total ? emptyHtml("search", "Try a project name, event, city, or status.") : ""}
  `;
  bindGtmCards(el);
  bindEventRows(el);
}

/* ---------- Routing ---------- */
const VIEWS = { dashboard: renderDashboard, events: renderEvents, content: renderContent, gtm: renderGtm };
const searchInput = document.getElementById("search");

function show(viewId, navKey) {
  navKey = navKey || viewId;
  document.querySelectorAll("nav a").forEach(a =>
    a.classList.toggle("active", a.dataset.view === navKey));
  document.querySelectorAll(".view").forEach(v => {
    const on = v.id === "view-" + viewId;
    if (on && !v.classList.contains("active")) { v.classList.remove("active"); void v.offsetWidth; }
    v.classList.toggle("active", on);
  });
}

function route() {
  const hash = (location.hash || "#dashboard").slice(1);
  if (searchInput.value.trim()) { searchInput.value = ""; }
  if (hash.startsWith("gtm/")) {
    renderGtmDetail(decodeURIComponent(hash.slice(4)));
    show("gtm-detail", "gtm");
  } else if (hash.startsWith("events/")) {
    renderEventDetail(decodeURIComponent(hash.slice(7)));
    show("event-detail", "events");
  } else {
    const view = VIEWS[hash] ? hash : "dashboard";
    VIEWS[view]();
    show(view);
  }
  window.scrollTo({ top: 0 });
}

searchInput.addEventListener("input", () => {
  const q = searchInput.value;
  if (q.trim()) { renderSearch(q); show("search"); }
  else route();
});
searchInput.addEventListener("keydown", e => {
  if (e.key === "Escape") { searchInput.value = ""; searchInput.blur(); route(); }
});

window.addEventListener("hashchange", route);

function initCounts() {
  document.getElementById("n-events").textContent = DATA.events.length || "";
  document.getElementById("n-content").textContent = DATA.content.length || "";
  document.getElementById("n-gtm").textContent = DATA.gtm.length || "";
}
document.getElementById("footer-updated").textContent = "Updated " + fmtDate(DATA.meta.updated);

initCounts();
route();

/* ---------- Theme ---------- */
const themeToggle = document.getElementById("theme-toggle");
const themeColorMeta = document.querySelector('meta[name="theme-color"]');
function syncThemeColor() {
  const dark = document.documentElement.getAttribute("data-theme") === "dark";
  themeColorMeta.setAttribute("content", dark ? "#0C141E" : "#ffffff");
}
themeToggle.addEventListener("click", () => {
  const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("jcc-theme", next); } catch (e) {}
  syncThemeColor();
});
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", e => {
  let saved = null;
  try { saved = localStorage.getItem("jcc-theme"); } catch (err) {}
  if (!saved) {
    document.documentElement.setAttribute("data-theme", e.matches ? "dark" : "light");
    syncThemeColor();
  }
});
syncThemeColor();
</script>
